schemaVersion: 1
id: slides-styler
name: Slides Styler
description: 无模版风格管线的文本判断环节——direction 阶段把用户指令与累积反馈凝成纵览图生图提示词，settle 阶段把聚类色板与视觉属性复核成完整风格参数（字号阶梯、字体映射、母题、效果文案），全程不做检索不落页
mode: dispatch_only
enabled: true

systemPrompt: ./SYSTEM.md

skills: []

mcp: []

inputSchema: ./schemas/input.schema.json
outputSchema: ./schemas/output.schema.json

policy:
  allowedCallers: [primary-agent]
  maxConcurrency: 2
  # 纯文本判断，无工具调用预算需求；给少量余量容纳重试。
  maxToolCalls: 8
  timeoutSeconds: 240

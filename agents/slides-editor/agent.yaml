schemaVersion: 1
id: slides-editor
name: Slides Editor
description: 用户确认草稿后的编辑/剪辑代理——把长文 points 压成每页 1 句 message + ≤3 条 facts + speakerNotes，并给出 composition/emphasis/intent/takeaway 的 storyboard；不检索、不排版、不建文件
mode: dispatch_only
enabled: true

systemPrompt: ./SYSTEM.md

skills: []

mcp: []

inputSchema: ./schemas/input.schema.json
outputSchema: ./schemas/output.schema.json

policy:
  allowedCallers: [primary-agent]
  maxConcurrency: 2
  # 12~24 页 storyboard 的 JSON 输出量接近 planner 方案，90s 实测必超时；
  # 与 planner 对齐 420s，并留出一次 schema 修正的调用余量。
  maxToolCalls: 8
  timeoutSeconds: 420

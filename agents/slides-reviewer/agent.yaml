schemaVersion: 1
id: slides-reviewer
name: Slides Reviewer
description: 双输入审页代理——多模态原生看 PPT 页面截图，判断这一页好不好看、元素有没有问题；决定修改时才取说明书（该页内容+当前布局树）并自己重排该页，经确定性校验后提交修正树；单代理闭环，网关只机械套用
mode: dispatch_only
enabled: true

systemPrompt: ./SYSTEM.md

skills:
  - ./skills/layout-tree-skill
  - ./skills/layout-tree-v2-skill

mcp: []

inputSchema: ./schemas/input.schema.json
outputSchema: ./schemas/output.schema.json

policy:
  allowedCallers: [primary-agent]
  maxConcurrency: 4
  # 看图判断 1 轮 + 决定修改时：读说明书/语法 2~3 次 + validate ≤4 次 + 提交 1 次。
  # 16 留出一次「读 v1+v2 技能 + 多一轮校验」的余量（实测 17 轮 validate 打穿过 16）。
  maxToolCalls: 16
  timeoutSeconds: 300
  # 审页模型（vlm 档）输出上限通常只有 8k：思考档 medium 时会先烧光输出预算，
  # 导致 stopReason=length（2026-10 近 7 天 12 次 failed）。降到 low 给正文留空间。
  model:
    reasoning: low
